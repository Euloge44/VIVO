version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=vivo.settings
    depends_on:
      - db
    networks:
      - vivo_network

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=vivo_db
      - POSTGRES_USER=vivo_user
      - POSTGRES_PASSWORD=vivo_password
    ports:
      - "5432:5432"
    networks:
      - vivo_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - vivo_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  vivo_network:
    driver: bridge